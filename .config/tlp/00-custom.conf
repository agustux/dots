# TLP >= 1.11 profiles: PRF (AC default), BAL (battery default), SAV (power-saver).
# Set every profile explicitly: an unset one keeps the previous profile's value.

# CPU
CPU_SCALING_GOVERNOR_ON_PRF=powersave
CPU_SCALING_GOVERNOR_ON_BAL=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_BOOST_ON_PRF=1
CPU_BOOST_ON_BAL=0
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_PRF=1
CPU_HWP_DYN_BOOST_ON_BAL=0
CPU_HWP_DYN_BOOST_ON_SAV=0
NMI_WATCHDOG=0

# PCIe / Runtime PM (auto on AC too)
PCIE_ASPM_ON_BAL=powersave
PCIE_ASPM_ON_SAV=powersave
RUNTIME_PM_ON_PRF=auto
RUNTIME_PM_ON_BAL=auto
RUNTIME_PM_ON_SAV=auto

# USB
USB_AUTOSUSPEND=1

# WiFi
WIFI_PWR_ON_BAL=on
WIFI_PWR_ON_SAV=on
